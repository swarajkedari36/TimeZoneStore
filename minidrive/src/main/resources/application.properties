# Server Configuration
server.port=8080
spring.application.name=MiniDrive

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/minidrive?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Properties - FIXED property names
upload.dir=uploads
share.expiry.minutes=30
jwt.secret=mySecretKeyForJWTTokenGeneration1234567890
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.fileshare=DEBUG